name: TWRP - Build
on:
  workflow_dispatch:
    inputs:
      # --- Manifest 仓库选择 ---
      manifest_repo_url:
        description: '选择 TWRP Manifest 仓库'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git'
        type: choice
        options:
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      manifest_branch:
        description: 'Manifest 分支 (例如: twrp-10.0-deprecated, twrp-11, twrp-12.1, 或自定义)'
        required: true
        default: 'twrp-10.0-deprecated'
        type: string   # 允许自由输入

      # --- 设备树配置 ---
      device_tree_repo_url:
        description: '设备树 GitHub 仓库 URL (例如: https://github.com/simonsmh/android_device_xiaomi_umi)'
        required: true
        default: 'https://github.com/simonsmh/android_device_xiaomi_umi'
        type: string
      device_tree_branch:
        description: '设备树分支 (例如: android-11.0-new, main)'
        required: true
        default: 'android-11.0-new'
        type: string
      device_tree_path:
        description: '设备树在源码中的路径 (例如: device/xiaomi/umi)'
        required: true
        default: 'device/xiaomi/umi'
        type: string

      # --- 编译目标 ---
      lunch_target:
        description: 'lunch 目标 (例如: omni_umi-eng)'
        required: true
        default: 'omni_umi-eng'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 检出仓库 (用于保存工作流自身)
        uses: actions/checkout@v4

      - name: 准备编译环境
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 设置 ccache (基于设备树分支做缓存)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-twrp-${{ github.event.inputs.device_tree_branch }}-${{ github.run_id }}
          max-size: 5G

      - name: 初始化 Repo (使用自定义 Manifest 仓库和分支)
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u "${{ github.event.inputs.manifest_repo_url }}" \
            -b "${{ github.event.inputs.manifest_branch }}" --depth=1

      - name: 添加自定义设备树到 Local Manifest
        run: |
          cd twrp
          mkdir -p .repo/local_manifests
          # 从输入的 URL 中提取仓库名称 (例如: android_device_xiaomi_umi)
          REPO_NAME=$(basename "${{ github.event.inputs.device_tree_repo_url }}" .git)
          cat > .repo/local_manifests/custom_device.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="${{ github.event.inputs.device_tree_path }}" 
                     name="$REPO_NAME" 
                     remote="custom" 
                     revision="${{ github.event.inputs.device_tree_branch }}" />
          </manifest>
          EOF
          # 添加自定义远程仓库
          git config -f .repo/manifests/.git/config --add remote.custom.url "${{ github.event.inputs.device_tree_repo_url }}"

      - name: 同步源码
        run: |
          cd twrp
          repo sync --force-sync --no-tags --no-clone-bundle -j$(nproc)

      - name: 编译 Recovery 镜像
        run: |
          cd twrp
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          # 增加一个安全回退：如果 ALLOW_MISSING_DEPENDENCIES=true 失败，则尝试不带该参数
          mka recoveryimage ALLOW_MISSING_DEPENDENCIES=true || mka recoveryimage
        env:
          CCACHE_EXEC: /usr/bin/ccache
          USE_CCACHE: 1
          CCACHE_DIR: /home/runner/.ccache

      - name: 上传 Recovery 镜像
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/recovery.img
          if-no-files-found: error
