name: TWRP - Build

on:
  workflow_dispatch:
    inputs:
      # --- Manifest 仓库选择 ---
      manifest_repo_url:
        description: 'TWRP manifest 仓库地址'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git'
        type: choice
        options:
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git

      # --- 分支选择（预设 + 自定义）---
      manifest_branch_preset:
        description: '选择常用的 manifest 分支（若选“自定义”，请在下方输入）'
        required: true
        default: 'twrp-12.1'                     # 改为默认 12.1
        type: choice
        options:
          # Omni 仓库常用分支
          - twrp-10.0-deprecated
          - twrp-9.0
          - twrp-8.1
          - twrp-7.1
          - twrp-6.0
          - twrp-5.1
          - twrp-4.4-deprecated
          # AOSP 仓库常用分支
          - twrp-14.1
          - twrp-14
          - twrp-12.1
          - twrp-11
          # 自定义选项
          - 自定义

      manifest_branch_custom:
        description: '如果上面选择了“自定义”，请在此输入自定义分支名'
        required: false
        default: ''

      # --- 设备树配置 ---
      device_tree_repo_url:
        description: '设备树 GitHub 仓库地址（例如 https://github.com/你的用户名/android_device_oppo_xxx）'
        required: true
        default: 'https://github.com/rtyutechstudio/android_device_oppo_a32-twrp'
        type: string
      device_tree_branch:
        description: '设备树分支'
        required: true
        default: 'main'
        type: string
      device_tree_path:
        description: '设备树在源码中的存放路径（例如 device/oppo/PDVM00）'
        required: true
        default: 'device/oppo/PDVM00'
        type: string

      # --- 编译目标 ---
      lunch_target:
        description: 'lunch 目标（例如 twrp_PDVM00-eng）'
        required: true
        default: 'twrp_PDVM00-eng'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备编译环境
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 清理磁盘空间 (Clean-up)
        uses: rokibhasansagar/slimhub_actions@main

      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-twrp-${{ github.event.inputs.device_tree_branch }}-${{ github.run_id }}
          max-size: 5G

      - name: 确定最终使用的 manifest 分支
        id: manifest_branch
        run: |
          if [[ "${{ github.event.inputs.manifest_branch_preset }}" == "自定义" ]]; then
            BRANCH="${{ github.event.inputs.manifest_branch_custom }}"
            if [[ -z "$BRANCH" ]]; then
              echo "❌ 错误：选择了“自定义”但未填写自定义分支名"
              exit 1
            fi
          else
            BRANCH="${{ github.event.inputs.manifest_branch_preset }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "✅ 使用的 manifest 分支: $BRANCH"

      - name: 初始化 repo
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u "${{ github.event.inputs.manifest_repo_url }}" \
            -b "${{ steps.manifest_branch.outputs.branch }}" --depth=1

      - name: 通过 local manifest 添加自定义设备树（修复 remote 定义）
        run: |
          cd twrp
          mkdir -p .repo/local_manifests
          
          # 获取输入变量
          DEVICE_TREE_URL="${{ github.event.inputs.device_tree_repo_url }}"
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"  # 移除末尾的 .git
          DEVICE_TREE_PATH="${{ github.event.inputs.device_tree_path }}"
          DEVICE_TREE_BRANCH="${{ github.event.inputs.device_tree_branch }}"
          
          # 从 URL 中提取 fetch 基址和项目名
          if [[ $DEVICE_TREE_URL =~ ^(https?://[^/]+)/(.*)$ ]]; then
            FETCH="${BASH_REMATCH[1]}"
            NAME="${BASH_REMATCH[2]}"
          elif [[ $DEVICE_TREE_URL =~ ^(git@[^:]+):(.*)$ ]]; then
            FETCH="${BASH_REMATCH[1]}:"
            NAME="${BASH_REMATCH[2]}"
          else
            echo "❌ 不支持的 URL 格式: $DEVICE_TREE_URL"
            echo "请使用 https:// 或 git@ 格式。"
            exit 1
          fi
          
          # 生成 local manifest，包含 remote 定义
          cat > .repo/local_manifests/custom_device.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="custom" fetch="$FETCH" />
            <project path="$DEVICE_TREE_PATH" name="$NAME" remote="custom" revision="$DEVICE_TREE_BRANCH" />
          </manifest>
          EOF
          
          echo "✅ 已生成 local manifest："
          echo "   fetch    = $FETCH"
          echo "   name     = $NAME"
          echo "   path     = $DEVICE_TREE_PATH"
          echo "   revision = $DEVICE_TREE_BRANCH"

      - name: 同步源码
        run: |
          cd twrp
          repo sync --force-sync --no-tags --no-clone-bundle -j$(nproc)

      - name: 编译 recovery 镜像（包含清理步骤）
        run: |
          cd twrp
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          # 先执行 make clean 确保干净构建，再编译 recovery
          make clean
          mka recoveryimage ALLOW_MISSING_DEPENDENCIES=true || mka recoveryimage
        env:
          CCACHE_EXEC: /usr/bin/ccache
          USE_CCACHE: 1
          CCACHE_DIR: /home/runner/.ccache

      - name: 上传 recovery 镜像
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/recovery.img
          if-no-files-found: error
